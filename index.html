<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário e Calculadora</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3a8a, #7c3aed);
        min-height: 100vh;
        padding: 30px;
        color: #172033;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    header {
        background: white;
        border-radius: 18px;
        padding: 25px;
        text-align: center;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    header h1 {
        margin: 0 0 8px;
        color: #4338ca;
    }

    .menu {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 18px;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        cursor: pointer;
        background: #4f46e5;
        color: white;
        font-weight: bold;
        font-size: 15px;
    }

    button:hover { opacity: .85; }

    .section {
        background: white;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,.2);
        display: none;
    }

    .section.active { display: block; }

    h2 {
        margin-top: 0;
        color: #4338ca;
        text-align: center;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    input, select {
        padding: 11px;
        border: 2px solid #c7d2fe;
        border-radius: 8px;
        font-size: 15px;
    }

    .calendar {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    .calendar th {
        background: #4f46e5;
        color: white;
        padding: 12px;
    }

    .calendar td {
        border: 1px solid #ddd;
        height: 65px;
        vertical-align: top;
        padding: 8px;
    }

    .calendar .today {
        background: #ddd6fe;
        font-weight: bold;
    }

    .events {
        margin-top: 25px;
        padding: 18px;
        background: #f5f3ff;
        border-radius: 12px;
    }

    .events h3 { color: #6d28d9; }

    .event {
        padding: 8px;
        margin: 5px 0;
        border-left: 5px solid #7c3aed;
        background: white;
        border-radius: 5px;
    }

    .year {
        text-align: center;
    }

    .year-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
    }

    .mini-month {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px;
        background: #fafafa;
    }

    .mini-month h3 {
        text-align: center;
        color: #4f46e5;
    }

    .mini-month table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
    }

    .mini-month td, .mini-month th {
        text-align: center;
        padding: 4px;
    }

    .calculator {
        max-width: 450px;
        margin: auto;
    }

    .calculator label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    .calculator input, .calculator select {
        width: 100%;
    }

    .calculate-btn {
        width: 100%;
        margin-top: 20px;
        background: #059669;
    }

    .result {
        margin-top: 20px;
        padding: 18px;
        background: #d1fae5;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #065f46;
    }

    .error {
        margin-top: 15px;
        padding: 12px;
        background: #fee2e2;
        color: #991b1b;
        border-radius: 8px;
        text-align: center;
    }

    @media (max-width: 700px) {
        .year-grid { grid-template-columns: 1fr; }
        body { padding: 15px; }
    }
</style>
</head>

<body>
<div class="container">

<header>
    <h1>📅 Calendário e Calculadora 🧮</h1>
    <p>Escolha uma das ferramentas abaixo.</p>
    <div class="menu">
        <button onclick="mostrarSecao('calendario')">📅 Calendário</button>
        <button onclick="mostrarSecao('calculadora')">🧮 Calculadora</button>
    </div>
</header>

<section id="calendario" class="section active">
    <h2>Calendário</h2>

    <div class="controls">
        <select id="tipoVisualizacao" onchange="alterarVisualizacao()">
            <option value="mes">Visualizar mês</option>
            <option value="ano">Visualizar ano</option>
        </select>
        <input type="number" id="ano" value="2026" min="1" max="9999">
        <select id="mes">
            <option value="0">Janeiro</option>
            <option value="1">Fevereiro</option>
            <option value="2">Março</option>
            <option value="3">Abril</option>
            <option value="4">Maio</option>
            <option value="5">Junho</option>
            <option value="6">Julho</option>
            <option value="7">Agosto</option>
            <option value="8">Setembro</option>
            <option value="9">Outubro</option>
            <option value="10">Novembro</option>
            <option value="11">Dezembro</option>
        </select>
        <button onclick="gerarCalendario()">Mostrar</button>
    </div>

    <div id="calendarioResultado"></div>
</section>

<section id="calculadora" class="section">
    <h2>Calculadora</h2>

    <div class="calculator">
        <label for="numero1">Primeiro número:</label>
        <input type="number" id="numero1" step="any">

        <label for="operacao">Escolha a operação:</label>
        <select id="operacao">
            <option value="+">Adição (+)</option>
            <option value="-">Subtração (-)</option>
            <option value="*">Multiplicação (×)</option>
            <option value="/">Divisão (÷)</option>
        </select>

        <label for="numero2">Segundo número:</label>
        <input type="number" id="numero2" step="any">

        <button class="calculate-btn" onclick="calcular()">Calcular</button>

        <div id="resultadoCalculadora"></div>
    </div>
</section>

</div>

<script>
// Eventos cadastrados para aparecerem no calendário.
const eventos = {
    0: [{ data: 1, nome: "Ano Novo" }],
    3: [{ data: 21, nome: "Tiradentes" }],
    4: [{ data: 1, nome: "Dia do Trabalho" }],
    8: [{ data: 7, nome: "Independência do Brasil" }],
    9: [{ data: 12, nome: "Nossa Senhora Aparecida" }],
    10: [
        { data: 2, nome: "Finados" },
        { data: 15, nome: "Proclamação da República" },
        { data: 20, nome: "Dia da Consciência Negra" }
    ],
    11: [
        { data: 25, nome: "Natal" },
        { data: 31, nome: "Véspera de Ano Novo" }
    ]
};

const nomesMeses = [
    "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
    "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
];

// Alterna entre calendário e calculadora.
function mostrarSecao(id) {
    document.querySelectorAll(".section").forEach(secao => {
        secao.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

// Mostra ou esconde o seletor de mês conforme a visualização escolhida.
function alterarVisualizacao() {
    const tipo = document.getElementById("tipoVisualizacao").value;
    document.getElementById("mes").style.display =
        tipo === "mes" ? "inline-block" : "none";
}

// Gera o calendário do mês escolhido.
function gerarMes(ano, mes) {
    const primeiroDia = new Date(ano, mes, 1).getDay();
    const ultimoDia = new Date(ano, mes + 1, 0).getDate();
    const hoje = new Date();

    let html = `<h2>${nomesMeses[mes]} de ${ano}</h2>`;
    html += `<table class="calendar"><thead><tr>`;
    html += "<th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th>";
    html += "<th>Qui</th><th>Sex</th><th>Sáb</th></tr></thead><tbody><tr>";

    for (let i = 0; i < primeiroDia; i++) {
        html += "<td></td>";
    }

    for (let dia = 1; dia <= ultimoDia; dia++) {
        const diaSemana = new Date(ano, mes, dia).getDay();
        const ehHoje =
            dia === hoje.getDate() &&
            mes === hoje.getMonth() &&
            ano === hoje.getFullYear();

        html += `<td class="${ehHoje ? "today" : ""}">${dia}</td>`;

        if (diaSemana === 6 && dia !== ultimoDia) {
            html += "</tr><tr>";
        }
    }

    const ultimoDiaSemana = new Date(ano, mes, ultimoDia).getDay();
    for (let i = ultimoDiaSemana; i < 6; i++) {
        html += "<td></td>";
    }

    html += "</tr></tbody></table>";

    const listaEventos = eventos[mes] || [];
    html += '<div class="events"><h3>📌 Eventos do mês</h3>';

    if (listaEventos.length === 0) {
        html += "<p>Nenhum evento cadastrado para este mês.</p>";
    } else {
        listaEventos.forEach(evento => {
            html += `<div class="event"><strong>${evento.data}/${mes + 1}</strong> - ${evento.nome}</div>`;
        });
    }

    html += "</div>";
    return html;
}

// Gera uma visão resumida dos 12 meses.
function gerarAno(ano) {
    let html = `<div class="year"><h2>Calendário de ${ano}</h2>`;
    html += '<div class="year-grid">';

    for (let mes = 0; mes < 12; mes++) {
        const primeiroDia = new Date(ano, mes, 1).getDay();
        const ultimoDia = new Date(ano, mes + 1, 0).getDate();

        let mini = `<div class="mini-month"><h3>${nomesMeses[mes]}</h3>`;
        mini += "<table><tr><th>D</th><th>S</th><th>T</th><th>Q</th><th>Q</th><th>S</th><th>S</th></tr><tr>";

        for (let i = 0; i < primeiroDia; i++) mini += "<td></td>";

        for (let dia = 1; dia <= ultimoDia; dia++) {
            mini += `<td>${dia}</td>`;
            const semana = new Date(ano, mes, dia).getDay();

            if (semana === 6 && dia !== ultimoDia) mini += "</tr><tr>";
        }

        mini += "</tr></table></div>";
        html += mini;
    }

    html += "</div>";

    html += '<div class="events"><h3>📌 Eventos do ano</h3>';
    let temEvento = false;

    for (let mes = 0; mes < 12; mes++) {
        (eventos[mes] || []).forEach(evento => {
            temEvento = true;
            html += `<div class="event"><strong>${evento.data}/${mes + 1}</strong> - ${evento.nome}</div>`;
        });
    }

    if (!temEvento) html += "<p>Nenhum evento cadastrado.</p>";
    html += "</div></div>";

    return html;
}

// Exibe a visualização escolhida.
function gerarCalendario() {
    const ano = Number(document.getElementById("ano").value);
    const mes = Number(document.getElementById("mes").value);
    const tipo = document.getElementById("tipoVisualizacao").value;
    const resultado = document.getElementById("calendarioResultado");

    if (!Number.isInteger(ano) || ano < 1 || ano > 9999) {
        resultado.innerHTML = '<div class="error">Digite um ano válido.</div>';
        return;
    }

    resultado.innerHTML =
        tipo === "mes" ? gerarMes(ano, mes) : gerarAno(ano);
}

// Faz uma operação por vez e trata divisão por zero.
function calcular() {
    const num1 = Number(document.getElementById("numero1").value);
    const num2 = Number(document.getElementById("numero2").value);
    const operacao = document.getElementById("operacao").value;
    const resultado = document.getElementById("resultadoCalculadora");

    if (document.getElementById("numero1").value === "" ||
        document.getElementById("numero2").value === "" ||
        !Number.isFinite(num1) || !Number.isFinite(num2)) {
        resultado.innerHTML =
            '<div class="error">Erro: digite dois números válidos.</div>';
        return;
    }

    if (operacao === "/" && num2 === 0) {
        resultado.innerHTML =
            '<div class="error">Erro: não é possível dividir por zero.</div>';
        return;
    }

    let valor;

    if (operacao === "+") valor = num1 + num2;
    else if (operacao === "-") valor = num1 - num2;
    else if (operacao === "*") valor = num1 * num2;
    else if (operacao === "/") valor = num1 / num2;

    const simbolos = { "+": "+", "-": "-", "*": "×", "/": "÷" };

    resultado.innerHTML =
        `<div class="result">${num1} ${simbolos[operacao]} ${num2} = ${valor}</div>`;
}

// Inicializa o calendário mostrando o mês atual.
const agora = new Date();
document.getElementById("ano").value = agora.getFullYear();
document.getElementById("mes").value = agora.getMonth();
gerarCalendario();
</script>
</body>
</html>
